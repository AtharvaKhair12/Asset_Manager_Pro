<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Verify your administrative node registration.">
    <title>AssetManager Pro | Node Verification</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;
            --accent-glow: #00f2ff;
            --accent-secondary: #004085;
            --text-pure: #ffffff;
            --text-bright: #f0f0f0;
            --text-muted: #d1d5db;
            --glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.1);
            --transition-pro: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body {
            background: #050505;
            color: var(--text-pure);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            perspective: 1000px;
        }

        /* --- ENVIRONMENT FX --- */
        .aurora-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -4;
            overflow: hidden;
            pointer-events: none;
        }

        .aurora-blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.3;
            animation: drift 25s infinite alternate;
        }

        .blob-1 {
            top: -20%;
            left: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--accent-glow), transparent 60%);
        }

        .blob-2 {
            bottom: -20%;
            right: -20%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--accent-secondary), transparent 60%);
            animation-duration: 40s;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(40px, 40px) rotate(5deg);
            }
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -3;
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
        }

        #cursor-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.12) 0%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: -2;
            transition: opacity 0.3s;
            mix-blend-mode: screen;
        }

        /* --- FLOATING ICONS --- */
        .tech-loop i {
            position: absolute;
            color: var(--accent-glow);
            opacity: 0.15;
            animation: floatIcon 12s infinite ease-in-out;
            text-shadow: 0 0 25px var(--accent-glow);
            z-index: -1;
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-30px);
            }
        }

        /* --- 3D AUTH CARD --- */
        .glass-card-wrapper {
            transition: transform 0.1s;
            perspective: 1000px;
            max-width: 480px;
            width: 100%;
            padding: 20px;
        }

        .auth-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            padding: 3.5rem 3rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.04), transparent);
            transform: skewX(-25deg);
            transition: 0.5s;
            pointer-events: none;
        }

        .auth-card:hover::before {
            left: 150%;
            transition: 0.7s;
        }

        /* --- FORM ELEMENTS --- */
        .form-label {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-glow);
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 16px 20px;
            border-radius: 14px;
            transition: var(--transition-pro);
            font-size: 1.5rem;
            letter-spacing: 10px;
            text-align: center;
        }

        .form-control:focus {
            background: rgba(0, 242, 255, 0.05);
            border-color: var(--accent-glow);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.15);
            color: white;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 10px;
        }

        /* --- BUTTONS --- */
        .btn-terminal {
            background: var(--accent-glow);
            color: #000;
            font-weight: 800;
            padding: 18px;
            border-radius: 50px;
            border: none;
            transition: var(--transition-pro);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 20px;
            font-size: 1rem;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.25);
        }

        .btn-terminal:hover {
            transform: scale(1.03);
            background: #ffffff;
            box-shadow: 0 0 60px rgba(0, 242, 255, 0.6);
        }

        .alert {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff4d4d;
            border-radius: 12px;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .auth-footer-link {
            color: var(--text-bright);
            font-size: 0.9rem;
            text-decoration: none;
            transition: 0.3s;
            border-bottom: 1px solid transparent;
        }

        .auth-footer-link:hover {
            color: var(--accent-glow);
            border-color: var(--accent-glow);
        }
    </style>
</head>

<body>

    <div id="cursor-glow"></div>
    <div class="aurora-container">
        <div class="aurora-blob blob-1"></div>
        <div class="aurora-blob blob-2"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="tech-loop">
        <i class="bi bi-shield-check"
            style="font-size: 10rem; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.03; z-index: -5;"></i>
        <i class="bi bi-envelope-paper" style="font-size: 5rem; top: 15%; right: 15%; opacity: 0.05;"></i>
        <i class="bi bi-key"
            style="font-size: 6rem; bottom: 15%; left: 10%; opacity: 0.05; animation-delay: 2s;"></i>
    </div>

    <div class="glass-card-wrapper" onmousemove="tiltCard(event, this)" onmouseleave="resetTilt(this)">
        <main class="auth-card">
            <div class="text-center mb-5">
                <div class="mb-3 d-inline-block p-3 rounded-circle"
                    style="background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(0, 242, 255, 0.2);">
                    <i class="bi bi-shield-check display-4"
                        style="color: var(--accent-glow); filter: drop-shadow(0 0 15px var(--accent-glow));"></i>
                </div>
                <h1 class="h3 fw-bold text-white mt-2">Node <span class="fw-light opacity-75">Verification</span></h1>
                <p class="small text-bright opacity-75">Secure Database Gateway v2.0</p>
            </div>

            <div th:if="${param.sent}" class="alert alert-success border-0 mb-4 text-center shadow-lg" role="alert">
                <i class="bi bi-envelope-check-fill me-2"></i> Registration successful! We've sent a 6-digit code to your email.
            </div>
            
            <div th:if="${param.error}" class="alert alert-danger border-0 mb-4 text-center shadow-lg" role="alert">
                <i class="bi bi-x-circle-fill me-2"></i> Invalid or expired verification code. Please try again.
            </div>

            <form th:action="@{/verify}" method="post">
                <div class="mb-4 text-center">
                    <label class="form-label" for="code">6-Digit Access Code</label>
                    <input type="text" id="code" name="code" class="form-control" placeholder="000000" maxlength="6"
                        required autofocus>
                </div>

                <button type="submit" class="btn btn-terminal w-100 shadow-lg"
                    aria-label="Verify Code">
                    Verify Code <i class="bi bi-check2-circle"></i>
                </button>
            </form>

            <div class="text-center mt-5 pt-4 border-top border-white border-opacity-10">
                <div class="mb-2">
                    <a href="/login" class="auth-footer-link">Already Verified? <span
                            style="color: var(--accent-glow);">Return to Login</span></a>
                </div>
            </div>
        </main>

        <footer class="mt-4 text-center">
            <p class="small mb-0" style="color: var(--text-muted); opacity: 0.6;">&copy; 2026 AssetManager Pro.
                Precision Tracking Suite.</p>
        </footer>
    </div>

    <script>
        // 3D TILT LOGIC
        function tiltCard(e, cardWrapper) {
            const card = cardWrapper.querySelector('.auth-card');
            const rect = cardWrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -8;
            const rotateY = ((x - centerX) / centerX) * 8;
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        }

        function resetTilt(cardWrapper) {
            cardWrapper.querySelector('.auth-card').style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
        }

        // CURSOR GLOW
        const cursor = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>

</body>

</html>
