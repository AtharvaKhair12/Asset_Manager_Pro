<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Authorized login portal for AssetManager Pro administrative terminal.">
    <title>AssetManager Pro | Authorized Entry</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;
            --accent-glow: #00f2ff;
            --accent-dim: rgba(0, 242, 255, 0.1);
            --text-pure: #ffffff;
            --text-muted: #b0b0b0; /* Lightened Grey for better contrast */
            --glass: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition-pro: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body {
            background: radial-gradient(circle at center, #0d0d0d, #050505);
            color: var(--text-pure);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            margin: 0;
        }

        /* --- AMBIENT BACKGROUND --- */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-dim), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(50px);
        }

        /* --- AUTH CARD --- */
        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3.5rem;
            transition: var(--transition-pro);
            animation: slideUp 0.7s forwards;
            opacity: 0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card:focus-within {
            border-color: var(--accent-glow);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.05);
        }

        /* --- INPUT STYLING --- */
        .form-label {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .form-control {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            transition: var(--transition-pro);
        }

        .form-control:focus {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px var(--accent-dim);
            color: white;
        }

        /* --- BUTTONS --- */
        .btn-terminal {
            background: var(--accent-glow);
            color: #000;
            font-weight: 800;
            padding: 15px;
            border-radius: 12px;
            border: none;
            transition: var(--transition-pro);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-terminal:hover {
            transform: scale(1.02);
            background: #ffffff;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .alert {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: #ff4d4d;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .alert-success { color: #00ff88; }

        .auth-footer-link {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: 0.3s;
        }

        .auth-footer-link:hover {
            color: var(--accent-glow);
        }
    </style>
</head>
<body>

<div class="bg-glow" aria-hidden="true"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <main class="auth-card">
                <div class="text-center mb-5">
                    <i class="bi bi-shield-lock-fill display-4 text-primary mb-3" style="color: var(--accent-glow) !important; filter: drop-shadow(0 0 10px var(--accent-dim));" aria-hidden="true"></i>
                    <h1 class="h3 fw-bold">Admin <span class="fw-light">Terminal</span></h1>
                    <p class="small" style="color: var(--text-muted);">Initialize Secure Session</p>
                </div>

                <div th:if="${param.success}" class="alert alert-success border-0 mb-4 text-center" role="alert">
                    <i class="bi bi-check-circle me-2"></i> Registration Authorized.
                </div>
                <div th:if="${param.error}" class="alert alert-danger border-0 mb-4 text-center" role="alert">
                    <i class="bi bi-exclamation-triangle me-2"></i> Invalid Credentials.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="admin_user" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Access Key</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-terminal w-100" aria-label="Establish secure database connection">Establish Connection</button>
                </form>

                <div class="text-center mt-4">
                    <a href="/register" class="auth-footer-link" aria-label="Register a new administrative node">New Node? Register Account</a>
                </div>
            </main>

            <footer class="mt-5 py-4 text-center border-top border-secondary border-opacity-10 opacity-75">
                <div class="mb-1 fw-bold">AssetManager <span class="text-primary fw-light" style="color: var(--accent-glow) !important;">PRO EDITION</span></div>
                <p class="small mb-0" style="color: var(--text-muted);">&copy; 2026 Enterprise Solutions Group. Precision Tracking Suite.</p>
            </footer>
        </div>
    </div>
</div>

</body>
</html>
